[tool.poetry]
name = "patent-agent-system"
version = "0.1.0"
description = "Enterprise-grade multi-agent system for Korean patent workflows"
authors = ["Patent Agent Team"]
readme = "README.md"
packages = [{include = "patent_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# LangChain Ecosystem
langgraph = "^0.2"
langchain = "^0.3"
langchain-core = "^0.3"
langchain-community = "^0.3"
langchain-anthropic = "^0.3"
langchain-openai = "^0.2"

# Configuration & Validation
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-dotenv = "^1.0"
pyyaml = "^6.0"

# Patent Database Tools
# langchain-kipris-tools = {git = "https://github.com/nuri428/langchain_kipris_tools.git"}
# patent-client = "^5.0"

# Document Processing
# docling = "^2.0"
# python-hwp = "^0.1"

# Vector Store & Embeddings
chromadb = "^0.5"
# transformers = "^4.40"  # For KorPatELECTRA

# Monitoring & Tracing
# opik = "^1.0"

# Utilities
httpx = "^0.27"
tenacity = "^9.0"
structlog = "^24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
pytest-cov = "^5.0"
ruff = "^0.7"
mypy = "^1.13"
pre-commit = "^4.0"
python-semantic-release = "^10.5"
git-cliff = "^2.0"

[tool.poetry.scripts]
patent-agent = "patent_agent.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src/patent_agent --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/patent_agent"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Semantic Release Configuration
[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variables = ["src/patent_agent/__init__.py:__version__"]
branch = "main"
build_command = "poetry build"
commit_message = "chore(release): v{version}"
tag_format = "v{version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "docs", "style", "refactor", "perf", "test", "build", "ci", "chore"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "dev"
